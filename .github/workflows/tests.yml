name: Tests

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
        - master

jobs:
  stack:
    name: Stack
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        # manually sync with cabal
        versions:
          #- <snapshot version> <ghc version>
          # - nosnapshot 9.14
          - nightly-2026-11-03 9.12.4
          - 24.11 9.10.3
          - 23.28 9.8.4
          - 22.44 9.6.7
          - 21.25 9.4.8
          - 20.26 9.2.8
    steps:
      - name: Parse lts and ghc versions
        shell: sh
        run: |
          echo snapshot=$(echo ${{ matrix.versions }} | cut -d ' ' -f 1) >> $GITHUB_ENV
          echo ghcVersion=$(echo ${{ matrix.versions }} | cut -d ' ' -f 2) >> $GITHUB_ENV
      - name: Setup Haskell
        id: setup-haskell-stack
        uses: haskell-actions/setup@v2.7
        with:
          ghc-version: ${{ env.ghcVersion }}
          enable-stack: true
          stack-version: 'latest'
          cabal-update: false
      - name: Clone project
        uses: actions/checkout@v4
      - name: Use Cache
        uses: actions/cache@v4
        with:
          key: ${{ matrix.os }}_${{ env.snapshot }}_${{ github.head_ref }}
          restore-keys: |
            ${{ matrix.os }}_${{ env.snapshot }}_${{ github.head_ref }}
            ${{ matrix.os }}_${{ env.snapshot }}_${{ github.base_ref }}
            ${{ matrix.os }}_${{ env.snapshot }}_
            ${{ matrix.os }}_${{ env.snapshot }}
          path: |
            ${{ steps.setup-haskell-stack.outputs.stack-root }}
            .stack-work
            */.stack-work
      - name: Build and run tests
        shell: bash
        run: |
          set -ex
          ghc --version
          stack --version
          stack test --system-ghc $extraLibDirs $extraIncludeDirsLLVM $extraIncludeDirsFFI --fast --no-terminal --snapshot=lts-$snapshot
      - name: Check for Source Changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]
          then
            >&2 echo 'ERROR: Source Changed After Build'
            >&2 git diff
            >&2 git status
            >&2 echo 'ERROR: Source Changed After Build'
            exit 1
          fi
  Cabal:
    name: Cabal ${{ matrix.ghc }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        # manually sync with stack
        ghc:
          - 9.14
          - 9.12.4
          - 9.10.3
          - 9.8.4
          - 9.6.7
          - 9.4.8
          - 9.2.8
    steps:
      - name: Clone project
        uses: actions/checkout@v7
      - name: Setup Haskell
        id: setup-haskell-cabal
        uses: haskell-actions/setup@v2.7
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "latest"
      - name: "Cabal: Update cabal package database, generate build plan"
        run: |
          cabal update
          cabal build --dry-run
      - name: Use Cache
        uses: actions/cache@v6
        with:
          key: ${{ matrix.os }}_cabal_ghc_${{ matrix.ghc }}_${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ matrix.os }}-ghc-${{ matrix.ghc }}-
          path: |
            ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
            dist-newstyle
      - name: Build and run tests
        run: |
          cabal test --enable-tests --minimize-conflict-set -O0 all
